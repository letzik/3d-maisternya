home:
  uk:
    eyebrow: "// клуб 3D-моделювання · 2026–2027"
    title: "Бачити форму."
    title2: "Будувати світи."
    lede: "Навчальний ресурс клубу «3D-Майстерня». Ми не вивчаємо одну програму — ми вчимося бачити прості форми в будь-якому об’єкті й збирати з них своє: персонажів, транспорт, будівлі, реквізит для ігор."
    cta_start: "Почати з першого кроку"
    cta_program: "Карта року"
    idea_title: "Ідея в трьох кроках"
    idea:
      - {n: "01", t: "Побачити", d: "Будь-який предмет складається з простих форм: куб, куля, циліндр, конус, тор, площина. Це навичка, яку ми тренуємо весь рік."}
      - {n: "02", t: "Розкласти", d: "Складну ідею не будують суцільним шматком. Її розбивають на 3–5 частин, кожну опрацьовують окремо й збирають у фіналі."}
      - {n: "03", t: "Зібрати", d: "Кожен блок закінчується реальним артефактом, який можна показати: від першого кольорового об’єкта до моделі в AR на телефоні."}
    map_title: "Карта року"
    map_lede: "Дев’ять блоків — від першого об’єкта за одне заняття до портфоліо-сторінки. Кожен закінчується чекпоінтом і має «виклик» для тих, хто швидший."
    ex_title: "Потренуйся між заняттями"
    ex_lede: "Короткі інтерактивні вправи працюють прямо в браузері, без встановлення й реєстрації."
    need_title: "Що потрібно"
    need:
      - {t: "Комп’ютер", d: "Звичайний ПК чи ноутбук — цього достатньо."}
      - {t: "Blender", d: "Безкоштовна програма для 3D. Ми працюємо в Blender 5.2 LTS."}
      - {t: "Телефон", d: "Для блоку 8: власна модель у доповненій реальності. iOS чи Android."}
      - {t: "Своя ідея", d: "Персонаж, транспорт, будівля — що цікаво вам. Досвід не потрібен."}
    need_blender: "Завантажити Blender"
    languages_note: "Ресурс двомовний: перемикач мови вгорі відкриває ту саму сторінку іншою мовою."
  en:
    eyebrow: "// 3D modeling club · 2026–2027"
    title: "See the shape."
    title2: "Build worlds."
    lede: "The learning resource of the “3D Workshop” club. We don’t learn one program — we learn to see simple shapes in any object and to assemble our own things from them: characters, vehicles, buildings, game props."
    cta_start: "Start with the first step"
    cta_program: "Year map"
    idea_title: "The idea in three steps"
    idea:
      - {n: "01", t: "See", d: "Any object is made of simple shapes: box, sphere, cylinder, cone, torus, plane. This is the skill we train all year."}
      - {n: "02", t: "Break down", d: "A complex idea is not built as one solid piece. Split it into 3–5 parts, work on each separately and assemble them at the end."}
      - {n: "03", t: "Assemble", d: "Every block ends with a real artifact you can show: from your first colored object to a model in AR on your phone."}
    map_title: "Year map"
    map_lede: "Nine blocks — from a first object in a single session to a portfolio page. Each one ends with a checkpoint and has a “challenge” for those who move faster."
    ex_title: "Practice between sessions"
    ex_lede: "Short interactive exercises run right in the browser — nothing to install, no sign-up."
    need_title: "What you need"
    need:
      - {t: "A computer", d: "An ordinary PC or laptop is enough."}
      - {t: "Blender", d: "Free 3D software. We work in Blender 5.2 LTS."}
      - {t: "A phone", d: "For block 8: your own model in augmented reality. iOS or Android."}
      - {t: "Your own idea", d: "A character, vehicle, building — whatever interests you. No experience needed."}
    need_blender: "Download Blender"
    languages_note: "This resource is bilingual: the language switch at the top opens the same page in the other language."
